# ── libretacobro-mailer: worker de envío de correos ──────────────────────────
# Comparte la BD con el WAR: la tabla EmailsPendientes es el contrato (OutboxContrato,
# verificado al arrancar por ContratoOutboxCheck; si falta una columna el worker no arranca).
# En prod, apuntar con las MISMAS env vars de SMTP que usa el WAR y APAGAR el
# dispatcher del WAR (app.outbox.dispatcher.enabled=false).

spring.application.name=libretacobro-mailer

# BD (defaults = entorno de desarrollo local; en prod van por env vars)
spring.datasource.url=${MAILER_DB_URL:jdbc:mariadb://localhost:3306/desarrollo}
spring.datasource.username=${MAILER_DB_USER:conor}
spring.datasource.password=${MAILER_DB_PASSWORD:conor}
# Pool chico: este proceso hace un puñado de queries cada 30s.
spring.datasource.hikari.maximum-pool-size=3

# SMTP — mismas variables que el WAR. Vacío = LogOnlyEmailSender (dev).
app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cadencia del despacho (mismos nombres y defaults que el WAR).
app.outbox.pollMs=${OUTBOX_POLL_MS:30000}
app.outbox.initialDelayMs=${OUTBOX_INITIAL_DELAY_MS:10000}

# Latido de salud: MailerHealthCheck loguea el estado del worker cada 5 min
# (ERROR si está caído, WARN si el último tick falló, DEBUG si todo bien).
app.health.logMs=${HEALTH_LOG_MS:300000}
app.health.initialDelayMs=${HEALTH_INITIAL_DELAY_MS:60000}
